AWSTemplateFormatVersion: '2010-09-09'
Description: Intelligence Engine - Bedrock model access for the human seats

# Until this stack existed, Bedrock was reachable only from *machine* identities
# inside the account: the workbench instance role, the App Runner instance role,
# the CodeBuild stage roles. Every human seat (steward, deployer, fde) could
# reach AWS but not a model, so running Claude Code meant first reaching the
# workbench over SSM. That is a fine default and a poor requirement - an
# engineer on a plane with a laptop should still be able to work.
#
# This grants the model calls to the seats a person actually assumes, so
# Claude Code authenticates the same way everything else here does: SSO login,
# assume the seat, four-hour session, every assumption a logged STS call.
#
# Deliberately NOT an API key. A long-term Bedrock API key is an IAM
# service-specific credential, which can only hang off an IAM *user* - and this
# estate has none, by design. It would mean minting a new identity class whose
# whole point is a bearer token that does not expire, sitting outside Identity
# Center, to reach the most expensive API in the account. The seat model gives
# the same reach with an expiring session and an audit trail. If a genuinely
# key-only environment turns up, short-term Bedrock API keys (<= 12h) can be
# generated from an assumed seat without any of that.
#
# Attachment is a deploy-time choice rather than a code change: flip a seat to
# Yes and redeploy. Revocation is deleting this stack - the seats keep every
# other permission they had.
#
# Cost: nothing. A policy bills nothing; the model calls it permits bill per
# token, against the same per-client Bedrock budgets in llm-controls.yaml.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

  AttachToFde:
    Type: String
    Default: 'Yes'
    AllowedValues: ['Yes', 'No']
    Description: >-
      The forward-deployed engineer seat. This is the seat that runs Claude
      Code, so it is the one seat on by default.

  AttachToSteward:
    Type: String
    Default: 'No'
    AllowedValues: ['Yes', 'No']
    Description: >-
      The data-steward seat. Off by default: admission and audit reading are
      not model work, and this seat already holds the only write into L1.

  AttachToDeployer:
    Type: String
    Default: 'No'
    AllowedValues: ['Yes', 'No']
    Description: >-
      The platform-engineer seat. Off by default: it exists to run stack
      operations, and widening it widens the deploy channel.

Conditions:
  FdeSeat: !Equals [!Ref AttachToFde, 'Yes']
  StewardSeat: !Equals [!Ref AttachToSteward, 'Yes']
  DeployerSeat: !Equals [!Ref AttachToDeployer, 'Yes']

Resources:

  BedrockSeatPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub intelligence-engine-${Environment}-bedrock-seat
      Description: Invoke Anthropic models from a human seat - no data-plane access
      # Attached from here rather than from each seat's own template, so adding
      # or removing a seat never touches the stack that owns the workbench
      # instance. Nothing is replaced to change who can call a model.
      Roles:
        - !If [FdeSeat, !Sub 'intelligence-engine-${Environment}-fde', !Ref 'AWS::NoValue']
        - !If [StewardSeat, !Sub 'intelligence-engine-${Environment}-steward', !Ref 'AWS::NoValue']
        - !If [DeployerSeat, !Sub 'intelligence-engine-${Environment}-deployer', !Ref 'AWS::NoValue']
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Same scoping as every other Bedrock grant here: Anthropic models
          # only, through the inference profiles the workload already uses.
          - Sid: InvokeClaude
            Effect: Allow
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
            Resource:
              - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/us.anthropic.*
              - !Sub arn:aws:bedrock:*:${AWS::AccountId}:application-inference-profile/*
              - arn:aws:bedrock:*::foundation-model/anthropic.*
          # Authenticating with a Bedrock API key rather than SigV4 is a
          # separate action, checked in addition to InvokeModel above. Without
          # it a minted key is accepted as a token and then refused at the
          # call: "not authorized to perform: bedrock:CallWithBearerToken".
          # It grants no model access on its own - it only permits presenting
          # a bearer token as this identity.
          - Sid: AuthenticateWithApiKey
            Effect: Allow
            Action: bedrock:CallWithBearerToken
            Resource: '*'
          # Claude Code resolves model ids at startup. Listing is metadata
          # only - it reveals which models exist, never any content - and
          # these calls do not support resource-level permissions.
          - Sid: DiscoverModels
            Effect: Allow
            Action:
              - bedrock:ListFoundationModels
              - bedrock:GetFoundationModel
              - bedrock:ListInferenceProfiles
              - bedrock:GetInferenceProfile
            Resource: '*'

Outputs:
  BedrockSeatPolicyArn:
    Description: Attach to any additional seat that should reach a model
    Value: !Ref BedrockSeatPolicy
    Export:
      Name: !Sub intelligence-engine-${Environment}-bedrock-seat-policy-arn

  SeatsGranted:
    Description: Which human seats can invoke a model after this deploy
    Value: !Join
      - ', '
      - - !If [FdeSeat, 'fde', !Ref 'AWS::NoValue']
        - !If [StewardSeat, 'steward', !Ref 'AWS::NoValue']
        - !If [DeployerSeat, 'deployer', !Ref 'AWS::NoValue']
