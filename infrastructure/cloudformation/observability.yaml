AWSTemplateFormatVersion: '2010-09-09'
Description: Intelligence Engine - Bedrock usage monitoring dashboard (all models)

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

Resources:
  BedrockUsageDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: intelligence-engine-bedrock-usage
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "text",
              "x": 0, "y": 0, "width": 24, "height": 1,
              "properties": {
                "markdown": "# Bedrock Usage — All Claude Models | ${Environment}"
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 1, "width": 4, "height": 4,
              "properties": {
                "metrics": [
                  ["AWS/Bedrock", "Invocations", "ModelId", "us.anthropic.claude-opus-4-6-v1", {"stat": "Sum", "label": "Opus 4.6"}],
                  ["AWS/Bedrock", "Invocations", "ModelId", "us.anthropic.claude-sonnet-4-6", {"stat": "Sum", "label": "Sonnet 4.6"}],
                  ["AWS/Bedrock", "Invocations", "ModelId", "us.anthropic.claude-haiku-4-5-20251001-v1:0", {"stat": "Sum", "label": "Haiku 4.5"}]
                ],
                "view": "singleValue",
                "region": "${AWS::Region}",
                "period": 86400,
                "title": "Invocations (24h)"
              }
            },
            {
              "type": "metric",
              "x": 4, "y": 1, "width": 5, "height": 4,
              "properties": {
                "metrics": [
                  ["AWS/Bedrock", "OutputTokenCount", "ModelId", "us.anthropic.claude-opus-4-6-v1", {"stat": "Sum", "label": "Opus 4.6 Output"}],
                  ["AWS/Bedrock", "OutputTokenCount", "ModelId", "us.anthropic.claude-sonnet-4-6", {"stat": "Sum", "label": "Sonnet 4.6 Output"}]
                ],
                "view": "singleValue",
                "region": "${AWS::Region}",
                "period": 86400,
                "title": "Output Tokens (24h)"
              }
            },
            {
              "type": "metric",
              "x": 9, "y": 1, "width": 5, "height": 4,
              "properties": {
                "metrics": [
                  ["AWS/Bedrock", "CacheReadInputTokenCount", "ModelId", "us.anthropic.claude-opus-4-6-v1", {"stat": "Sum", "label": "Cache Read (Opus 4.6)"}]
                ],
                "view": "singleValue",
                "region": "${AWS::Region}",
                "period": 86400,
                "title": "Cache Read Tokens (24h)"
              }
            },
            {
              "type": "metric",
              "x": 14, "y": 1, "width": 5, "height": 4,
              "properties": {
                "metrics": [
                  ["AWS/Bedrock", "CacheWriteInputTokenCount", "ModelId", "us.anthropic.claude-opus-4-6-v1", {"stat": "Sum", "label": "Cache Write (Opus 4.6)"}]
                ],
                "view": "singleValue",
                "region": "${AWS::Region}",
                "period": 86400,
                "title": "Cache Write Tokens (24h)"
              }
            },
            {
              "type": "metric",
              "x": 19, "y": 1, "width": 5, "height": 4,
              "properties": {
                "metrics": [
                  ["AWS/Bedrock", "InputTokenCount", "ModelId", "us.anthropic.claude-opus-4-6-v1", {"stat": "Sum", "label": "Opus 4.6"}],
                  ["AWS/Bedrock", "InputTokenCount", "ModelId", "us.anthropic.claude-sonnet-4-6", {"stat": "Sum", "label": "Sonnet 4.6"}]
                ],
                "view": "singleValue",
                "region": "${AWS::Region}",
                "period": 86400,
                "title": "Input Tokens (24h)"
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 5, "width": 12, "height": 6,
              "properties": {
                "metrics": [
                  ["AWS/Bedrock", "OutputTokenCount", "ModelId", "us.anthropic.claude-opus-4-6-v1", {"stat": "Sum", "label": "Opus 4.6 Output"}],
                  ["AWS/Bedrock", "OutputTokenCount", "ModelId", "us.anthropic.claude-sonnet-4-6", {"stat": "Sum", "label": "Sonnet 4.6 Output"}],
                  ["AWS/Bedrock", "CacheReadInputTokenCount", "ModelId", "us.anthropic.claude-opus-4-6-v1", {"stat": "Sum", "label": "Opus 4.6 Cache Read"}],
                  ["AWS/Bedrock", "InputTokenCount", "ModelId", "us.anthropic.claude-opus-4-6-v1", {"stat": "Sum", "label": "Opus 4.6 Input"}],
                  ["AWS/Bedrock", "InputTokenCount", "ModelId", "us.anthropic.claude-sonnet-4-6", {"stat": "Sum", "label": "Sonnet 4.6 Input"}]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "period": 300,
                "title": "Token Usage Over Time (5min)"
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 5, "width": 12, "height": 6,
              "properties": {
                "metrics": [
                  ["AWS/Bedrock", "Invocations", "ModelId", "us.anthropic.claude-opus-4-6-v1", {"stat": "Sum", "label": "Opus 4.6"}],
                  ["AWS/Bedrock", "Invocations", "ModelId", "us.anthropic.claude-sonnet-4-6", {"stat": "Sum", "label": "Sonnet 4.6"}],
                  ["AWS/Bedrock", "Invocations", "ModelId", "us.anthropic.claude-haiku-4-5-20251001-v1:0", {"stat": "Sum", "label": "Haiku 4.5"}],
                  ["AWS/Bedrock", "Invocations", "ModelId", "us.anthropic.claude-opus-4-5-20251101-v1:0", {"stat": "Sum", "label": "Opus 4.5"}],
                  ["AWS/Bedrock", "Invocations", "ModelId", "us.anthropic.claude-sonnet-4-5-20250929-v1:0", {"stat": "Sum", "label": "Sonnet 4.5"}]
                ],
                "view": "timeSeries",
                "stacked": true,
                "region": "${AWS::Region}",
                "period": 300,
                "title": "Invocations by Model (5min)"
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 11, "width": 12, "height": 6,
              "properties": {
                "metrics": [
                  ["AWS/Bedrock", "CacheReadInputTokenCount", "ModelId", "us.anthropic.claude-opus-4-6-v1", {"stat": "Sum", "label": "Cache Read"}],
                  ["AWS/Bedrock", "CacheWriteInputTokenCount", "ModelId", "us.anthropic.claude-opus-4-6-v1", {"stat": "Sum", "label": "Cache Write"}]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "period": 300,
                "title": "Prompt Cache Usage (Opus 4.6)"
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 11, "width": 12, "height": 6,
              "properties": {
                "metrics": [
                  ["AWS/Bedrock", "InvocationLatency", "ModelId", "us.anthropic.claude-opus-4-6-v1", {"stat": "Average", "label": "Opus 4.6 Avg"}],
                  ["AWS/Bedrock", "InvocationLatency", "ModelId", "us.anthropic.claude-opus-4-6-v1", {"stat": "p95", "label": "Opus 4.6 p95"}],
                  ["AWS/Bedrock", "InvocationLatency", "ModelId", "us.anthropic.claude-sonnet-4-6", {"stat": "Average", "label": "Sonnet 4.6 Avg"}],
                  ["AWS/Bedrock", "TimeToFirstToken", "ModelId", "us.anthropic.claude-opus-4-6-v1", {"stat": "Average", "label": "Opus 4.6 TTFT"}]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "period": 300,
                "title": "Latency & Time to First Token"
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 17, "width": 12, "height": 5,
              "properties": {
                "metrics": [
                  ["AWS/Bedrock", "InvocationClientErrors", "ModelId", "us.anthropic.claude-opus-4-6-v1", {"stat": "Sum", "label": "Opus 4.6 Client Errors"}],
                  ["AWS/Bedrock", "InvocationClientErrors", "ModelId", "us.anthropic.claude-sonnet-4-6", {"stat": "Sum", "label": "Sonnet 4.6 Client Errors"}],
                  ["AWS/Bedrock", "InvocationClientErrors", "ModelId", "us.anthropic.claude-opus-4-1-20250805-v1:0", {"stat": "Sum", "label": "Opus 4.1 Errors"}]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "period": 300,
                "title": "Client Errors"
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 17, "width": 12, "height": 5,
              "properties": {
                "metrics": [
                  ["AWS/Bedrock", "OutputTokenCount", "ModelId", "us.anthropic.claude-opus-4-6-v1", {"stat": "Sum", "label": "Opus 4.6"}],
                  ["AWS/Bedrock", "OutputTokenCount", "ModelId", "us.anthropic.claude-sonnet-4-6", {"stat": "Sum", "label": "Sonnet 4.6"}],
                  ["AWS/Bedrock", "OutputTokenCount", "ModelId", "us.anthropic.claude-opus-4-5-20251101-v1:0", {"stat": "Sum", "label": "Opus 4.5"}],
                  ["AWS/Bedrock", "OutputTokenCount", "ModelId", "us.anthropic.claude-sonnet-4-5-20250929-v1:0", {"stat": "Sum", "label": "Sonnet 4.5"}],
                  ["AWS/Bedrock", "OutputTokenCount", "ModelId", "us.anthropic.claude-haiku-4-5-20251001-v1:0", {"stat": "Sum", "label": "Haiku 4.5"}]
                ],
                "view": "timeSeries",
                "stacked": true,
                "region": "${AWS::Region}",
                "period": 3600,
                "title": "Output Tokens by Model (Hourly)"
              }
            },
            {
              "type": "text",
              "x": 0, "y": 17, "width": 24, "height": 1,
              "properties": {
                "markdown": "# Hosted Console — App Runner | ${Environment}\nEmpty until the app stack is deployed with --with-app."
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 18, "width": 8, "height": 5,
              "properties": {
                "metrics": [
                  ["AWS/AppRunner", "Requests", "ServiceName", "intelligence-engine-${Environment}-console", {"stat": "Sum"}],
                  ["AWS/AppRunner", "2xxStatusResponses", "ServiceName", "intelligence-engine-${Environment}-console", {"stat": "Sum"}],
                  ["AWS/AppRunner", "4xxStatusResponses", "ServiceName", "intelligence-engine-${Environment}-console", {"stat": "Sum"}],
                  ["AWS/AppRunner", "5xxStatusResponses", "ServiceName", "intelligence-engine-${Environment}-console", {"stat": "Sum"}]
                ],
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "period": 300,
                "title": "Requests and Status Codes"
              }
            },
            {
              "type": "metric",
              "x": 8, "y": 18, "width": 8, "height": 5,
              "properties": {
                "metrics": [
                  ["AWS/AppRunner", "RequestLatency", "ServiceName", "intelligence-engine-${Environment}-console", {"stat": "p50", "label": "p50"}],
                  ["AWS/AppRunner", "RequestLatency", "ServiceName", "intelligence-engine-${Environment}-console", {"stat": "p99", "label": "p99"}]
                ],
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "period": 300,
                "title": "Request Latency (ms)"
              }
            },
            {
              "type": "metric",
              "x": 16, "y": 18, "width": 8, "height": 5,
              "properties": {
                "metrics": [
                  ["AWS/AppRunner", "CPUUtilization", "ServiceName", "intelligence-engine-${Environment}-console", {"stat": "Average"}],
                  ["AWS/AppRunner", "MemoryUtilization", "ServiceName", "intelligence-engine-${Environment}-console", {"stat": "Average"}],
                  ["AWS/AppRunner", "ActiveInstances", "ServiceName", "intelligence-engine-${Environment}-console", {"stat": "Maximum", "label": "Active instances (pinned to 1)"}]
                ],
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "period": 300,
                "title": "Utilisation and Instance Count"
              }
            }
          ]
        }

Outputs:
  DashboardName:
    Value: intelligence-engine-bedrock-usage
    Export:
      Name: !Sub intelligence-engine-${Environment}-dashboard-name
