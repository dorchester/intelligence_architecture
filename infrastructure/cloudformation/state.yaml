AWSTemplateFormatVersion: '2010-09-09'
Description: Intelligence Engine - Run state store (DynamoDB)

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

Resources:
  RunStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub intelligence-engine-${Environment}-runs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: run_id
          AttributeType: S
        - AttributeName: client_id
          AttributeType: S
      KeySchema:
        - AttributeName: run_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: client-index
          KeySchema:
            - AttributeName: client_id
              KeyType: HASH
            - AttributeName: run_id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: intelligence-engine
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation

Outputs:
  TableName:
    Value: !Ref RunStateTable
    Export:
      Name: !Sub intelligence-engine-${Environment}-table-name
  TableArn:
    Value: !GetAtt RunStateTable.Arn
    Export:
      Name: !Sub intelligence-engine-${Environment}-table-arn
